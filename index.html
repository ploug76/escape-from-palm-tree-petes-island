const inR=(b,x,y,p=0)=>x>=b.x-p&&x<=b.x+b.w+p&&y>=b.y-p&&y<=b.y+b.h+p;
function padDirs(x,y){const P=LY.pad,dx=x-P.cx,dy=y-P.cy,ax=Math.abs(dx),ay=Math.abs(dy),o=[];if(Math.hypot(dx,dy)<P.a*.3)return o;const Tn=2.414;if(ax>ay/Tn)o.push(dx>0?'r':'l');if(ay>ax/Tn)o.push(dy>0?'d':'u');return o}
function onPad(x,y){const P=LY.pad,h=P.a*1.5+14;return Math.abs(x-P.cx)<=h&&Math.abs(y-P.cy)<=h}
function abAt(x,y,pad=12){const o=[];for(const k of ['b','a']){const q=LY.ab[k];if(Math.hypot(x-q.cx,y-q.cy)<=q.r+pad)o.push(k)}return o}
function inPanel(x,y){return LY.panel.some(p=>inR(p,x,y,0))}
function recompute(){const h={l:0,r:0,u:0,d:0,a:0,b:0};for(const q of ptrs.values()){if(q.pad)for(const k of q.pad)h[k]=1;if(q.ab)for(const k of q.ab)h[k]=1}
 for(const k in h)h[k]=h[k]||keys[k];for(const k of ['l','r','u','d','a','b'])if(h[k]&&!held[k])vib(8);held=h}
function resetInput(){ptrs.clear();keys={l:0,r:0,u:0,d:0,a:0,b:0};recompute();BTNDOWN=null}

  try{c.setPointerCapture(e.pointerId)}catch(_){}
  if(onPad(x,y)){ptrs.set(e.pointerId,{pad:padDirs(x,y)});recompute();return}
  const ab=abAt(x,y);if(ab.length){ptrs.set(e.pointerId,{ab});recompute();return}
  ptrs.set(e.pointerId,{dead:1});return}
